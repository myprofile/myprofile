- title: Automated end-to-end management of the modeling lifecycle in deep learning
  authors: Gharib Gharibi, Vijay Walunj, Raju Nekadi, Raj Marri, Yugyung Lee
  venue: Empirical Software Engineering, vol. 26, 2021 (Springer)
  description: >
    A software system that manages the whole deep learning modeling lifecycle end to end. Existing tools
    often tie users to a commercial platform, need significant code changes, or cover only one phase of
    the lifecycle.
  links:
