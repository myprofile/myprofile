- title: Siamese network-based multi-modal deepfake detection
  authors: Raju Nekadi
  venue: Master's thesis, University of Missouri–Kansas City, 2020
  description: >
    Detecting deepfakes in both video and audio with a Siamese network. CNN detectors such as VGGNet
    and InceptionNet need large training sets and high-end GPUs, and few studies address fake audio.
  links:
