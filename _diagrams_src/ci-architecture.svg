<svg viewBox="0 0 800 632" role="img" aria-labelledby="ci-arch-title ci-arch-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ci-arch-title">Call intelligence architecture</title>
<desc id="ci-arch-desc">Transcripts flow from the transcription platform to Cloud Storage to BigQuery. From there, the Gemini API writes a structured summary, an LLM labels resolution, and SQL computes operational metrics. The topic model (XLNet on four L4 GPUs) and regex entity matching read the summary. A consolidation step waits for all five jobs, then writes one dashboard table that powers the dashboard.</desc>
<defs><marker id="ci-arch-head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-head"/></marker></defs>
<rect class="dg-data" x="16" y="16" width="220" height="56" rx="6"/>
<text class="dg-t" x="126" y="40">Transcription platform</text>
<text class="dg-s" x="126" y="58">recordings → text</text>
<rect class="dg-data" x="290" y="16" width="220" height="56" rx="6"/>
<text class="dg-t" x="400" y="40">Cloud Storage</text>
<text class="dg-s" x="400" y="58">raw transcript files</text>
<rect class="dg-data" x="564" y="16" width="220" height="56" rx="6"/>
<text class="dg-t" x="674" y="40">BigQuery</text>
<text class="dg-s" x="674" y="58">call_transcript</text>
<path class="dg-line" d="M236 44 H290" marker-end="url(#ci-arch-head)"/>
<path class="dg-line" d="M510 44 H564" marker-end="url(#ci-arch-head)"/>
