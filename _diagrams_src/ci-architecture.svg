<rect class="dg-llm" x="16" y="120" width="368" height="56" rx="6"/>
<text class="dg-t" x="200" y="144">Structured summary</text>
<text class="dg-s" x="200" y="162">Gemini API · multiprocessing</text>
<rect class="dg-llm" x="414" y="120" width="170" height="56" rx="6"/>
<text class="dg-t" x="499" y="144">Resolution</text>
<text class="dg-s" x="499" y="162">LLM</text>
<rect class="dg-model" x="614" y="120" width="170" height="56" rx="6"/>
<text class="dg-t" x="699" y="144">Operational metrics</text>
<text class="dg-s" x="699" y="162">SQL</text>
<path class="dg-line" d="M200 176 V200 M101 200 H300"/>
<path class="dg-line" d="M101 200 V224" marker-end="url(#ci-arch-head)"/>
<path class="dg-line" d="M300 200 V224" marker-end="url(#ci-arch-head)"/>
<rect class="dg-model" x="16" y="224" width="170" height="56" rx="6"/>
<text class="dg-t" x="101" y="248">Call topics</text>
<text class="dg-s" x="101" y="266">XLNet · 4× L4 GPUs</text>
<rect class="dg-model" x="215" y="224" width="170" height="56" rx="6"/>
<text class="dg-t" x="300" y="248">Named entities</text>
<text class="dg-s" x="300" y="266">regex · keyword tables</text>
<path class="dg-line" d="M101 280 V304 M300 280 V304 M499 176 V304 M699 176 V304 M101 304 H699"/>
<path class="dg-line" d="M400 304 V328" marker-end="url(#ci-arch-head)"/>
<rect class="dg-key" x="200" y="328" width="400" height="64" rx="6"/>
<text class="dg-t dg-on-key" x="400" y="355">Consolidation</text>
<text class="dg-s dg-on-key" x="400" y="375">runs only after all five jobs succeed</text>
<path class="dg-line" d="M400 392 V424" marker-end="url(#ci-arch-head)"/>
<rect class="dg-data" x="200" y="424" width="400" height="64" rx="6"/>
