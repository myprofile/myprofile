<path class="dg-line" d="M546 145 H596" marker-end="url(#bff-detail-head)"/>
<rect class="dg-key" x="600" y="110" width="180" height="70" rx="6"/>
<text class="dg-t dg-on-key" x="690.0" y="141">Call detail</text>
<text class="dg-s dg-on-key" x="690.0" y="158">one JSON object</text>
</svg>
