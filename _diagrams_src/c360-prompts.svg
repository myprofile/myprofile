<svg class="diagram-svg" viewBox="0 0 800 788" role="img" aria-labelledby="c360-pr-title c360-pr-desc" xmlns="http://www.w3.org/2000/svg">
<title id="c360-pr-title">The two prompts</title>
<desc id="c360-pr-desc">The two prompts Call360 sends to Gemini 2.5 Flash-Lite, drawn as cards. Pass 1, summarize (step 5): a system section tells the model it helps customer service representatives prepare for calls, to use only the member context provided, write a brief summary of recent activity and likely reasons for calling, not to guess and not to include anything outside the context. An example section, picked by Sentence-BERT in step 4, shows a paid lab claim and a prior call about an ID card with a model summary. A member context section lists Jane's rows from Bigtable: paid medical claim for a routine office visit, denied Rx claim for a non-preferred drug, prior authorization approved after 5 days, open billing grievance, prior call about a refill delay. Gemini's summary then goes into pass 2, format JSON (step 6, same model): convert the summary into JSON with exactly the schema member_id string and talking_points list of strings; rules: 3 to 5 talking points each under 25 words, no text outside the JSON, do not add facts not in the summary. The guardrails are highlighted.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="dg-head"/></marker></defs>
<rect x="24" y="10" width="540" height="414" rx="6" fill="#ffffff" stroke="#1e1e1e"/>
<rect x="24" y="10" width="540" height="34" rx="6" class="dg-llm"/>
<text class="dg-t" x="42" y="32" style="text-anchor:start">Pass 1 prompt: Summarize</text>
<text class="dg-s" x="550" y="32" style="text-anchor:end">step 5 · Gemini 2.5 Flash-Lite</text>
<rect x="36" y="56" width="516" height="122" rx="6" fill="#ffffff" stroke="#1e1e1e"/>
<text class="dg-h" x="50" y="75">SYSTEM</text>
<text class="dg-l" x="50" y="95" style="font-size:12.5px">You are an assistant that helps customer service representatives</text>
<rect x="161.6" y="100" width="244.8" height="17" rx="2" fill="#ffec99" stroke="none"/>
<text class="dg-l" x="50" y="113" style="font-size:12.5px">prepare for calls. Using only the member context provided, write a</text>
<text class="dg-l" x="50" y="131" style="font-size:12.5px">brief summary of the member's recent activity and likely reasons</text>
<rect x="118.3" y="136" width="323.5" height="17" rx="2" fill="#ffec99" stroke="none"/>
<text class="dg-l" x="50" y="149" style="font-size:12.5px">for calling. Do not guess. Do not include information that isn't</text>
<rect x="48.0" y="154" width="95.6" height="17" rx="2" fill="#ffec99" stroke="none"/>
<text class="dg-l" x="50" y="167" style="font-size:12.5px">in the context.</text>
<rect x="36" y="188" width="516" height="90" rx="6" fill="#e5dbff" stroke="#1e1e1e"/>
<text class="dg-h" x="50" y="207">EXAMPLE (FEW-SHOT)</text>
<text class="dg-l" x="50" y="227" style="font-size:12.5px">Context: Paid claim for lab work; one prior call about an ID card.</text>
<text class="dg-l" x="50" y="245" style="font-size:12.5px">Summary: Member recently had lab work that was paid. They called</text>
<text class="dg-l" x="50" y="263" style="font-size:12.5px">before about an ID card, so they may be following up on that.</text>
<rect x="36" y="288" width="516" height="124" rx="6" fill="#fff9db" stroke="#1e1e1e"/>
<text class="dg-h" x="50" y="307">MEMBER CONTEXT</text>
<text class="dg-l" x="50" y="327" style="font-size:12.5px">- Paid medical claim: routine office visit</text>
<text class="dg-l" x="50" y="345" style="font-size:12.5px">- Denied Rx claim: non-preferred drug</text>
<text class="dg-l" x="50" y="363" style="font-size:12.5px">- Prior authorization: approved after 5 days</text>
<text class="dg-l" x="50" y="381" style="font-size:12.5px">- Open grievance: billing question</text>
<text class="dg-l" x="50" y="399" style="font-size:12.5px">- Prior call: refill delay</text>
<path class="dg-line" d="M584 117 H570" marker-end="url(#arr)"/>
<text class="dg-l dg-note" x="592" y="105" style="fill:var(--accent);font-size:12px">Instructions</text>
<text class="dg-l" x="592" y="121" style="font-size:12px">Highlighted: use only the</text>
<text class="dg-l" x="592" y="137" style="font-size:12px">context, and never guess.</text>
<path class="dg-line" d="M584 233 H570" marker-end="url(#arr)"/>
<text class="dg-l dg-note" x="592" y="221" style="fill:var(--accent);font-size:12px">Example</text>
<text class="dg-l" x="592" y="237" style="font-size:12px">Picked by Sentence-BERT in</text>
<text class="dg-l" x="592" y="253" style="font-size:12px">step 4: the closest past case.</text>
<path class="dg-line" d="M584 350 H570" marker-end="url(#arr)"/>
<text class="dg-l dg-note" x="592" y="338" style="fill:var(--accent);font-size:12px">Jane's context</text>
<text class="dg-l" x="592" y="354" style="font-size:12px">Her rows from Bigtable</text>
<text class="dg-l" x="592" y="370" style="font-size:12px">(step 3), as readable text.</text>
<path class="dg-line" d="M294 426 V464" marker-end="url(#arr)"/>
<text class="dg-l" x="306" y="449" style="font-size:12px">Gemini's summary goes into pass 2</text>
<rect x="24" y="468" width="540" height="310" rx="6" fill="#ffffff" stroke="#1e1e1e"/>
<rect x="24" y="468" width="540" height="34" rx="6" class="dg-llm"/>
<text class="dg-t" x="42" y="490" style="text-anchor:start">Pass 2 prompt: Format JSON</text>
<text class="dg-s" x="550" y="490" style="text-anchor:end">step 6 · same model</text>
<rect x="36" y="514" width="516" height="68" rx="6" fill="#ffffff" stroke="#1e1e1e"/>
<text class="dg-h" x="50" y="533">INSTRUCTION</text>
<rect x="317.5" y="540" width="129.3" height="17" rx="2" fill="#ffec99" stroke="none"/>
<text class="dg-l" x="50" y="553" style="font-size:12.5px">Convert the summary below into JSON with exactly this schema:</text>
<text class="dg-mono" x="50" y="571">{"member_id": string, "talking_points": [string]}</text>
<rect x="36" y="592" width="516" height="86" rx="6" fill="#ffffff" stroke="#1e1e1e"/>
<text class="dg-h" x="50" y="611">RULES</text>
<text class="dg-l" x="50" y="631" style="font-size:12.5px">- 3 to 5 talking points, each under 25 words.</text>
<text class="dg-l" x="50" y="649" style="font-size:12.5px">- No text outside the JSON.</text>
<rect x="59.4" y="654" width="304.2" height="17" rx="2" fill="#ffec99" stroke="none"/>
<text class="dg-l" x="50" y="667" style="font-size:12.5px">- Do not add facts that are not in the summary.</text>
<rect x="36" y="688" width="516" height="78" rx="6" fill="#fbe4ff" stroke="#1e1e1e"/>
<text class="dg-h" x="50" y="707">SUMMARY (FROM PASS 1)</text>
<text class="dg-l" x="50" y="727" style="font-size:12.5px">Denied non-preferred Rx; prior call about a refill delay;</text>
<text class="dg-l" x="50" y="745" style="font-size:12.5px">PA approved; billing grievance open.</text>
<path class="dg-line" d="M584 548 H570" marker-end="url(#arr)"/>
<text class="dg-l dg-note" x="592" y="536" style="fill:var(--accent);font-size:12px">Strict schema</text>
<text class="dg-l" x="592" y="552" style="font-size:12px">So the agent desktop can</text>
<text class="dg-l" x="592" y="568" style="font-size:12px">render it without surprises.</text>
<path class="dg-line" d="M584 636 H570" marker-end="url(#arr)"/>
<text class="dg-l dg-note" x="592" y="624" style="fill:var(--accent);font-size:12px">Rules</text>
<text class="dg-l" x="592" y="640" style="font-size:12px">Highlighted: the same</text>
<text class="dg-l" x="592" y="656" style="font-size:12px">guardrail, no new facts.</text>
<path class="dg-line" d="M584 727 H570" marker-end="url(#arr)"/>
<text class="dg-l dg-note" x="592" y="715" style="fill:var(--accent);font-size:12px">Pass 1's output</text>
<text class="dg-l" x="592" y="731" style="font-size:12px">Pasted in as the input</text>
<text class="dg-l" x="592" y="747" style="font-size:12px">for this call.</text>
</svg>
