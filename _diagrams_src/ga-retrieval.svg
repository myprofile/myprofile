<svg viewBox="0 0 800 580" role="img" aria-labelledby="ga-ret-title ga-ret-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ga-ret-title">Retrieval scoring</title>
<desc id="ga-ret-desc">A query, "What did you do at the clinic?", and a memory m, "joined the Environmental Law Clinic", are scored three ways. Recency: 0.995 to the power of hours since the memory was last accessed, drawn as a decaying curve. Importance: asked of the LLM once, when the memory is written; brushing teeth scores 2 and a break-up 9 (1 to 10 in the paper, 0 to 100 in the CS222 code). Relevance: cosine similarity of the embedding vectors, cos(emb(m), emb(query)), using the same model for both and computed per query. Each score is min-max normalized to the range 0 to 1, then combined as score(m) = alpha_rec times recency plus alpha_imp times importance plus alpha_rel times relevance, with all alphas equal to 1. The memories are sorted in descending order and the top ones are taken until the prompt token budget is full. What comes back is the clinic memory, not her childhood weekends in the forest.</desc>
<defs><marker id="ga-ret-head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-head"/></marker></defs>
<ellipse class="dg-data" cx="176" cy="52" rx="158" ry="38"/>
<text class="dg-s" x="176" y="42" style="font-size:13px">query</text>
<text class="dg-t" x="176" y="66">"What did you do at the clinic?"</text>
<rect class="dg-data" x="450" y="16" width="334" height="72" rx="10"/>
<text class="dg-s" x="617" y="42" style="font-size:13px">memory m</text>
<text class="dg-t" x="617" y="66">"joined the Environmental Law Clinic"</text>
<rect class="dg-data" x="16" y="120" width="240" height="196" rx="12"/>
<text class="dg-t" x="136" y="148" style="font-size:17px">recency</text>
<text class="dg-mono" x="36" y="172">0.995 ^ hours since</text>
<text class="dg-mono" x="36" y="188">last accessed</text>
<path d="M40 204 V290 H232" fill="none" stroke="#1e1e1e" stroke-width="1.3"/>
<path d="M42 206 L58 222 L73 235 L88 245 L104 253 L120 259 L135 263 L150 267 L166 270 L182 272 L197 274 L212 275 L228 276" fill="none" stroke="#7950f2" stroke-width="2.6"/>
<text class="dg-l" x="196" y="306">hours</text>
<rect class="dg-llm" x="280" y="120" width="240" height="196" rx="12"/>
<text class="dg-t" x="400" y="148" style="font-size:17px">importance</text>
<text class="dg-s" x="400" y="170">asked of the LLM once,</text>
<text class="dg-s" x="400" y="186">when the memory is written</text>
<text class="dg-mono" x="300" y="216">brushing teeth → 2</text>
<text class="dg-mono" x="300" y="234">break-up → 9</text>
<text class="dg-mono" x="300" y="266">(1–10 in the paper;</text>
<text class="dg-mono" x="300" y="284">0–100 in CS222 code)</text>
<rect class="dg-model" x="544" y="120" width="240" height="196" rx="12"/>
<text class="dg-t" x="664" y="148" style="font-size:17px">relevance</text>
<text class="dg-s" x="664" y="170">cosine similarity of</text>
<text class="dg-s" x="664" y="186">embedding vectors</text>
<text class="dg-mono" x="564" y="216">cos( emb(m), emb(query) )</text>
<text class="dg-mono" x="564" y="248">same model for both,</text>
<text class="dg-mono" x="564" y="266">computed per query</text>
<path class="dg-line" d="M136 316 V340" marker-end="url(#ga-ret-head)"/>
<path class="dg-line" d="M400 316 V340" marker-end="url(#ga-ret-head)"/>
<path class="dg-line" d="M664 316 V340" marker-end="url(#ga-ret-head)"/>
<rect class="dg-data" x="36" y="340" width="200" height="40" rx="8"/><text class="dg-s" x="136" y="365">min-max normalize → [0, 1]</text>
<rect class="dg-data" x="300" y="340" width="200" height="40" rx="8"/><text class="dg-s" x="400" y="365">min-max normalize → [0, 1]</text>
<rect class="dg-data" x="564" y="340" width="200" height="40" rx="8"/><text class="dg-s" x="664" y="365">min-max normalize → [0, 1]</text>
<path class="dg-line" d="M136 380 L200 414" marker-end="url(#ga-ret-head)"/>
<path class="dg-line" d="M400 380 V414" marker-end="url(#ga-ret-head)"/>
<path class="dg-line" d="M664 380 L600 414" marker-end="url(#ga-ret-head)"/>
<rect class="dg-llm" x="40" y="414" width="720" height="50" rx="10"/>
<text class="dg-t" x="400" y="444" style="font-size:13.5px">score(m) = α_rec · recency + α_imp · importance + α_rel · relevance   (α = 1, 1, 1)</text>
<path class="dg-line" d="M400 464 V496" marker-end="url(#ga-ret-head)"/>
<text class="dg-l" x="410" y="484">sort desc</text>
<rect class="dg-model" x="150" y="496" width="500" height="46" rx="10"/>
<text class="dg-t" x="400" y="524" style="font-size:14px">take the top memories until the prompt token budget is full</text>
<text class="dg-l" x="400" y="568" style="text-anchor:middle;fill:#7950f2;font-size:12.5px">what comes back: the clinic memory — not her childhood weekends in the forest</text>
</svg>
