<text class="dg-s" x="32" y="275" style="text-anchor:start">and data per person is sparse</text>
<rect class="dg-llm" x="276" y="16" width="248" height="344" rx="14"/>
<text class="dg-t" x="400" y="48" style="font-size:20px">Group</text><text class="dg-s" x="400" y="68" style="fill:var(--accent)">a few people who interact</text>
<text class="dg-h" x="292" y="100">question it answers</text>
<text class="dg-s" x="292" y="119" style="text-anchor:start">"how would these two</text>
<text class="dg-s" x="292" y="135" style="text-anchor:start">resolve this conflict?"</text>
<text class="dg-h" x="292" y="170">how you model it</text>
<text class="dg-s" x="292" y="189" style="text-anchor:start">several individual agents with</text>
<text class="dg-s" x="292" y="205" style="text-anchor:start">memory, interacting over ticks</text>
<text class="dg-h" x="292" y="240">failure mode</text>
<text class="dg-s" x="292" y="259" style="text-anchor:start">dynamics may never be</text>
<text class="dg-s" x="292" y="275" style="text-anchor:start">fully predictable</text>
<rect class="dg-model" x="536" y="16" width="248" height="344" rx="14"/>
<text class="dg-t" x="660" y="48" style="font-size:20px">Population</text><text class="dg-s" x="660" y="68" style="fill:var(--accent)">many people, aggregated</text>
<text class="dg-h" x="552" y="100">question it answers</text>
<text class="dg-s" x="552" y="119" style="text-anchor:start">"do older adults read</text>
<text class="dg-s" x="552" y="135" style="text-anchor:start">more than younger ones?"</text>
<text class="dg-h" x="552" y="170">how you model it</text>
<text class="dg-s" x="552" y="189" style="text-anchor:start">sample N personas from</text>
<text class="dg-s" x="552" y="205" style="text-anchor:start">demographics, average answers</text>
<text class="dg-h" x="552" y="240">failure mode</text>
<text class="dg-s" x="552" y="259" style="text-anchor:start">too coarse; can reproduce</text>
<text class="dg-s" x="552" y="275" style="text-anchor:start">bias and stereotypes</text>
