<svg viewBox="0 0 800 440" role="img" aria-labelledby="ga-levels-title ga-levels-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ga-levels-title">Levels of analysis</title>
<desc id="ga-levels-desc">Three levels of analysis, trading detail for scale. Individual: one specific person. Question it answers: would THIS person like these search results? How you model it: a detailed persona prompt plus memory of their history. Failure mode: noise, because people are inconsistent and data per person is sparse. Group: a few people who interact. Question: how would these two resolve this conflict? Model: several individual agents with memory, interacting over ticks. Failure mode: dynamics may never be fully predictable. Population: many people, aggregated. Question: do older adults read more than younger ones? Model: sample N personas from demographics and average the answers. Failure mode: too coarse, and can reproduce bias and stereotypes. Group means interactions between people; population means interventions on the whole.</desc>
<defs><marker id="ga-levels-head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-head"/></marker></defs>
