<svg class="diagram-svg" viewBox="0 0 800 404" role="img" aria-labelledby="fair-lf-title fair-lf-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fair-lf-title">LangFair at a glance</title>
<desc id="fair-lf-desc">How LangFair works. A team brings its own prompts from a real use case, plus either any LangChain chat model or responses it generated itself. LangFair then runs three steps: pick the metrics that fit the use case with its decision framework, generate responses (25 per prompt, plus counterfactual variants when prompts mention a group), and score only the outputs, with no access to model internals needed. Metrics depend on the use case: text generation and summarization use toxicity, stereotype and counterfactual metrics, which is where Call360 sits; classification looks at error-rate gaps between groups; recommendation looks at ranking gaps between groups. The result is scores plus the exact responses behind them, for human review and governance audits. LangFair is built by CVS Health's governance team, is open source, and is used by teams across the company.</desc>
