<rect x="260" y="30" width="280" height="252" rx="8" fill="#fbe4ff" stroke="#1e1e1e"/>
<rect x="276" y="44" width="248" height="58" rx="6" fill="#ffffff" stroke="#1e1e1e"/>
<text class="dg-t" x="400" y="67">1  Pick the metrics</text>
<text class="dg-s" x="400" y="86">decision framework for your use case</text>
