<svg class="diagram-svg" viewBox="0 0 950 466" role="img" aria-labelledby="c360-arch-title c360-arch-desc" xmlns="http://www.w3.org/2000/svg">
<title id="c360-arch-title">Call360 architecture</title>
<desc id="c360-arch-desc">Six sources (call data, membership, medical and Rx claims, regulatory, surveys, member events) feed pipelines run by Cloud Composer: streaming ingest, Dataproc Serverless batch jobs and Gemini transcript summaries, then field-level PII tokenization, into BigQuery. A daily load writes eight per-domain Bigtable tables (calls, claims, Rx, prior auth, grievances, complaints, surveys, member feedback) keyed by memberId#eventDate with a 90-day TTL. The Call360 API reads them in about 27 ms and handles each request in order: gateway OAuth check, the Spring Boot API on GKE, Sentence-BERT few-shot selection, Gemini 2.5 Flash-Lite summarization, a second Gemini pass that formats JSON, and talking points on the agent desktop. Every call is logged to an audit trail.</desc>
