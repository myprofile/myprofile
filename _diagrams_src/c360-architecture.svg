<svg class="diagram-svg" viewBox="0 0 942 500" role="img" aria-labelledby="c360-arch-title c360-arch-desc" xmlns="http://www.w3.org/2000/svg">
<title id="c360-arch-title">Call360 architecture</title>
<desc id="c360-arch-desc">Source data (call data, membership, medical and Rx claims, regulatory, surveys and member events) flows through Cloud Composer pipelines into BigQuery, then into per-domain Bigtable tables keyed by member ID and date with a 90-day TTL. The Call360 API selects few-shot examples with Sentence-BERT, summarizes with Gemini 2.5 Flash-Lite on Vertex AI, formats JSON in a second Gemini pass, and sends talking points to the agent desktop.</desc>
