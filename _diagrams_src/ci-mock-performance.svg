<svg viewBox="0 0 800 500" role="img" aria-labelledby="ci-mp-title ci-mp-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ci-mp-title">Performance dashboard (mock)</title>
<desc id="ci-mp-desc">Hand-drawn wireframe of the mock Contact Intelligence Performance page. Sidebar: Performance (selected), Topic Insights, Named Entities, Trends, Contact Table, Session Review. Filters: LOB-A, Jan 1 to Apr 30, Calls. Operational metrics: contact volume 412,500; average handle time 09:45; average hold time 01:10; transfer rate 18.0%; average sentiment 0.61; resolution 72.4%. A line chart of total volume month over month rises from about 95K in January to 105K in February and 110K in March, then dips to about 102K in April. All numbers are mock data.</desc>
