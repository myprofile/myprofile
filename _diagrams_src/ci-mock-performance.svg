<text class="dg-t dg-on-key" x="24" y="34" style="text-anchor:start;font-size:16px">◆ Contact Intelligence</text>
<rect class="dg-llm" x="228" y="16" width="124" height="24" rx="12"/><text class="dg-s" x="290" y="32">DEMO · mock data</text>
