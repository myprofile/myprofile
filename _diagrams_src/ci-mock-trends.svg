<svg viewBox="0 0 800 530" role="img" aria-labelledby="ci-mock-tr-title ci-mock-tr-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ci-mock-tr-title">Mock Trends dashboard</title>
<desc id="ci-mock-tr-desc">Mock Contact Intelligence dashboard, Trends page (demo, mock data). Sidebar with Trends selected. Filters: LOB-A, Jan 1 to Apr 30, granularity month. Line chart of distinct calls by topic group from January to April. All six groups rise from January to a peak in March and dip slightly in April: Benefits and coverage from about 29K to 34K, Claims about 22K to 26K, Find care / network about 16K to 19K, ID cards and enrollment about 11K to 13K, Billing and payments about 9K to 11K, and Pharmacy about 8K to 9K.</desc>
