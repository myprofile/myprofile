<svg viewBox="0 0 800 486" role="img" aria-labelledby="ci-mock-ti-title ci-mock-ti-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ci-mock-ti-title">Mock Topic Insights dashboard</title>
