<title id="ci-mock-session-review-title">Mock dashboard: Session Review</title>
<desc id="ci-mock-session-review-desc">Mock dashboard, Session Review page (demo data): transcript and structured summary for one call. Call ID DEMO-000417, date Mar 12, LOB-A, 4,210 input tokens, 612 output tokens. Transcript excerpt: Jane Doe asks why her thyroid medication refill cost $95 when it was $30 last month; the pharmacist could not explain it, so the agent transfers her to the pharmacy benefits team. Structured summary (decoded JSON): concise summary of the call; contact information (caller Jane Doe, about Jane Doe, type Member, relationship Self); intent &quot;understand why thyroid medication copay rose from $30 to $95&quot; with solution &quot;transferred to pharmacy benefits team&quot;; repeated issue 0, call transfers 1, no next steps; a future-call watchout to be ready to explain the copay change; entities: benefits prescription coverage, specialists pharmacist.</desc>
