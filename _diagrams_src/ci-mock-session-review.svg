<text x="160" y="178" style="font-size:13px;fill:#1e1e1e;font-weight:600">Transcript (excerpt)</text>
<text class="dg-mono" x="160" y="200" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">AGENT: Good morning, who am I speaking with?</text>
<text class="dg-mono" x="160" y="215" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">CALLER: This is Jane Doe, calling for myself.</text>
<text class="dg-mono" x="160" y="230" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">AGENT: How can I help today?</text>
<text class="dg-mono" x="160" y="245" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">CALLER: My thyroid medication refill cost $95</text>
<text class="dg-mono" x="160" y="260" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">        this time. Last month it was $30.</text>
<text class="dg-mono" x="160" y="275" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">CALLER: I already asked the pharmacist and</text>
<text class="dg-mono" x="160" y="290" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">        they couldn&#x27;t explain it.</text>
<text class="dg-mono" x="160" y="305" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">AGENT: I understand. Let me connect you with</text>
<text class="dg-mono" x="160" y="320" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">       our pharmacy benefits team.</text>
<text class="dg-mono" x="160" y="335" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">       [transfer]</text>
<text class="dg-mono" x="160" y="350" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">AGENT 2: Pharmacy benefits, how can I help?</text>
<text class="dg-mono" x="160" y="365" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">       [...]</text>
<rect class="dg-llm" x="452" y="154" width="332" height="416" rx="6"/>
<text x="464" y="178" style="font-size:13px;fill:#40045c;font-weight:600">Structured summary (decoded JSON)</text>
<text class="dg-mono" x="464" y="200" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">concise_summary:</text>
<text class="dg-mono" x="464" y="215" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">  Jane Doe called about her thyroid medication</text>
<text class="dg-mono" x="464" y="230" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">  refill rising from $30 to $95. She had already</text>
<text class="dg-mono" x="464" y="245" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">  asked the pharmacist without an answer. The agent</text>
<text class="dg-mono" x="464" y="260" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">  transferred her to the pharmacy benefits team.</text>
<text class="dg-mono" x="464" y="290" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">contact_information:</text>
<text class="dg-mono" x="464" y="305" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">  caller: Jane Doe  |  about: [Jane Doe]</text>
<text class="dg-mono" x="464" y="320" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">  type: [Member]    |  relationship: [Self]</text>
<text class="dg-mono" x="464" y="350" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">call_intents_and_solutions:</text>
<text class="dg-mono" x="464" y="365" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">  - intent: Understand why thyroid medication</text>
<text class="dg-mono" x="464" y="380" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">            copay rose from $30 to $95</text>
<text class="dg-mono" x="464" y="395" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">    solution: Transferred to pharmacy benefits team</text>
<text class="dg-mono" x="464" y="425" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">repeated_issue: 0      call_transfers: 1</text>
<text class="dg-mono" x="464" y="440" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">next_steps_caller: []  next_steps_agent: []</text>
<text class="dg-mono" x="464" y="455" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">future_call_watchouts:</text>
<text class="dg-mono" x="464" y="470" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">  - Caller already asked the pharmacist; be ready</text>
<text class="dg-mono" x="464" y="485" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">    to explain the copay change if she calls again</text>
<text class="dg-mono" x="464" y="515" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">entities:</text>
<text class="dg-mono" x="464" y="530" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">  benefits: [prescription coverage]</text>
<text class="dg-mono" x="464" y="545" xml:space="preserve" style="font-size:9.5px;fill:#1e1e1e">  specialists: [pharmacist]</text>
</svg>
