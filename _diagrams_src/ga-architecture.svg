<svg viewBox="0 0 800 500" role="img" aria-labelledby="ga-arch-title ga-arch-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ga-arch-title">Generative agent architecture</title>
<desc id="ga-arch-desc">The environment (town map, objects, other agents, clock) feeds perceive, which writes to the memory stream: an append-only list of natural-language records. Example records for Trang: observation 08:02 Trang reviews a case file; observation 08:10 study group meets; plan 13:00 law clinic hours, 180 minutes; observation 13:04 drafting a case memo; reflection I believe in grassroots work. Each record holds its text, when it was created and last accessed, an importance score and an embedding. Reflect reads about 100 recent records, asks questions and writes insights back, triggered when the summed importance of new memories passes a threshold. Plan works at day, hour and 5 to 15 minute levels, re-plans on surprise, and plans are written back as memories too. Retrieve takes the top-k records by score into scratch memory, the working set that fits in the prompt; the LLM turns it into an act, which says something, moves, or changes an object in the environment. Everything is a memory: perceptions, plans and reflections share one stream, and every action is built from what retrieval reads back out.</desc>
