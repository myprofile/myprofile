<svg viewBox="0 0 830 270" role="img" aria-labelledby="fair-flow-title fair-flow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fair-flow-title">Fairness check flow</title>
<desc id="fair-flow-desc">A member record goes into the pass 1 summary prompt. The summary is checked for use of demographic data, toxicity and stereotypes, and the checks feed one results table.</desc>
<defs><marker id="fair-flow-head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-head"/></marker></defs>
<rect class="dg-data" x="16" y="110" width="150" height="70" rx="6"/>
<text class="dg-t" x="91" y="141">Member record</text>
<text class="dg-s" x="91" y="158">mock context, no demographics</text>
<rect class="dg-llm" x="216" y="110" width="150" height="70" rx="6"/>
<text class="dg-t" x="291" y="141">Pass 1 summary</text>
<text class="dg-s" x="291" y="158">Gemini 2.5 Flash-Lite</text>
<path class="dg-line" d="M166 145 H212" marker-end="url(#fair-flow-head)"/>
<path class="dg-line" d="M366 145 H400"/>
<path class="dg-line" d="M400 44 V204"/>
<rect class="dg-model" x="430" y="14" width="180" height="60" rx="6"/>
<text class="dg-t dg-on-key" x="520" y="40">Unawareness check</text>
<text class="dg-s dg-on-key" x="520" y="57">is demographic data used?</text>
<path class="dg-line" d="M400 44 H426" marker-end="url(#fair-flow-head)"/>
<path class="dg-line" d="M610 44 H636"/>
<rect class="dg-model" x="430" y="94" width="180" height="60" rx="6"/>
<text class="dg-t dg-on-key" x="520" y="120">Toxicity</text>
<text class="dg-s dg-on-key" x="520" y="137">is anything harmful?</text>
<path class="dg-line" d="M400 124 H426" marker-end="url(#fair-flow-head)"/>
<path class="dg-line" d="M610 124 H636"/>
<rect class="dg-model" x="430" y="174" width="180" height="60" rx="6"/>
<text class="dg-t dg-on-key" x="520" y="200">Stereotype</text>
<text class="dg-s dg-on-key" x="520" y="217">does it link groups to stereotypes?</text>
<path class="dg-line" d="M400 204 H426" marker-end="url(#fair-flow-head)"/>
<path class="dg-line" d="M610 204 H636"/>
<path class="dg-line" d="M636 44 V204"/>
<path class="dg-line" d="M636 124 H656" marker-end="url(#fair-flow-head)"/>
<rect class="dg-key" x="660" y="94" width="144" height="60" rx="6"/>
<text class="dg-t dg-on-key" x="732" y="120">Results</text>
<text class="dg-s dg-on-key" x="732" y="137">one table per run</text>
<text class="dg-l" x="16" y="250">The summary is what gets checked. The same checks run again after every prompt change.</text>
</svg>
