<svg class="sketch" viewBox="0 0 800 292" role="img" aria-labelledby="trang-ot-title trang-ot-desc" xmlns="http://www.w3.org/2000/svg">
<title id="trang-ot-title">One turn of Trang's simulation</title>
<desc id="trang-ot-desc">One turn of Trang's simulation: Perceive (sees the bowls, steps and oven), Retrieve (pulls the recipe from memory), Act (model call 1: "I'll add the flour"), Extract (model call 2: add 250 flour), and Apply (kitchen rules check and reply), with feedback looping back to Perceive. Act and Extract ask the language model; the other steps are plain Python.</desc>
<text class="dg-t" x="16" y="32" style="text-anchor:start;font-size:22px">One turn of Trang's simulation</text>
<text class="dg-l" x="16" y="60" style="font-size:13px">Orchid steps ask the language model. Yellow steps are plain Python.</text>
