<svg viewBox="0 0 800 168" role="img" aria-labelledby="c360-lat-title c360-lat-desc" xmlns="http://www.w3.org/2000/svg">
<title id="c360-lat-title">Formatter step latency, before and after</title>
<desc id="c360-lat-desc">Before: gemini-2.0-flash-001 took about 3 to 4 seconds for the formatting step. After: Gemini 2.5 Flash-Lite with thinking disabled averaged about 1.07 seconds.</desc>
<text class="dg-h" x="16" y="16">FORMATTER STEP LATENCY (SECONDS)</text>
<text class="dg-t" x="16" y="52" style="text-anchor:start">Before</text>
<text class="dg-s" x="16" y="70" style="text-anchor:start">2.0 Flash</text>
<rect x="130" y="36" width="420" height="36" rx="3" fill="#d9d9d9"/>
<rect x="550" y="36" width="140" height="36" rx="3" fill="#ececec"/>
<text class="dg-t" x="700" y="59" style="text-anchor:start">~3–4 s</text>
<text class="dg-t" x="16" y="112" style="text-anchor:start">After</text>
<text class="dg-s" x="16" y="130" style="text-anchor:start">2.5 Flash-Lite</text>
<rect x="130" y="96" width="150" height="36" rx="3" fill="var(--accent)"/>
<text class="dg-t" x="290" y="119" style="text-anchor:start;fill:var(--accent)">~1.07 s average</text>
<path d="M130 148 H690" stroke="#c9c9c9" stroke-width="1"/>
<g class="dg-l" text-anchor="middle"><text x="130" y="164">0</text><text x="270" y="164">1</text><text x="410" y="164">2</text><text x="550" y="164">3</text><text x="690" y="164">4</text></g>
</svg>
