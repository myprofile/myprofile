<svg class="sketch" viewBox="0 0 800 292" role="img" aria-labelledby="ci2-found-title ci2-found-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ci2-found-title">The structured summary as a foundation</title>
<desc id="ci2-found-desc">A raw transcript is thousands of words with transcription errors, greetings, ID checks and hold chatter. An LLM turns it into a structured JSON summary with a consistent shape. The topic model, the entity matching step and human session review all read the summary instead of the transcript.</desc>
