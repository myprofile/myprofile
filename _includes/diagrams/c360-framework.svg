<svg viewBox="0 0 800 352" role="img" aria-labelledby="c360-fw-title c360-fw-desc" xmlns="http://www.w3.org/2000/svg">
<title id="c360-fw-title">Call360 pipeline framework</title>
<desc id="c360-fw-desc">Layer 1: every BigQuery domain pipeline runs the same four steps (population, join and enrich, status buckets with a global member ID, final insert) inside an audit wrapper that tracks run IDs, run states, row counts and daily or backfill mode. Layer 2: one YAML registry of 14 sources feeds a factory DAG that generates one Airflow DAG per source; each runs extract, transform and load from the Layer 1 tables into Bigtable.</desc>
<defs><marker id="c360-fw-head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-head"/></marker></defs>
<text class="dg-h" x="16" y="14">LAYER 1 · EVERY BIGQUERY DOMAIN PIPELINE, SAME FOUR STEPS</text>
<rect class="dg-data" x="16" y="26" width="176" height="60" rx="6"/><text class="dg-t" x="104" y="51">1 · Population</text><text class="dg-s" x="104" y="70">eligible members</text>
<rect class="dg-data" x="213" y="26" width="176" height="60" rx="6"/><text class="dg-t" x="301" y="51">2 · Join and enrich</text><text class="dg-s" x="301" y="70">domain events, filters</text>
<rect class="dg-llm" x="410" y="26" width="176" height="60" rx="6"/><text class="dg-t" x="498" y="51">3 · Status buckets</text><text class="dg-s" x="498" y="70">readable text · global ID</text>
<rect class="dg-data" x="607" y="26" width="177" height="60" rx="6"/><text class="dg-t" x="695" y="51">4 · Final insert</text><text class="dg-s" x="695" y="70">staging → audit → prod</text>
<path class="dg-line" d="M192 56 H213" marker-end="url(#c360-fw-head)"/>
<path class="dg-line" d="M389 56 H410" marker-end="url(#c360-fw-head)"/>
<path class="dg-line" d="M586 56 H607" marker-end="url(#c360-fw-head)"/>
<rect x="16" y="98" width="768" height="32" rx="6" fill="none" stroke="#c9c9c9" stroke-width="1.25" stroke-dasharray="5 4"/>
<text class="dg-s" x="400" y="119">audit wrapper: run_id · RUNNING / SUCCESS / FAILED / ABORTED · row counts · DAILY or BACKFILL</text>
<path class="dg-line" d="M695 130 V196" stroke-dasharray="4 4" marker-end="url(#c360-fw-head)"/>
<text class="dg-l" x="685" y="166" text-anchor="end">reads Layer 1 tables</text>
<text class="dg-h" x="16" y="184">LAYER 2 · ONE FACTORY DAG FOR ALL 14 SOURCES</text>
<rect class="dg-data" x="16" y="196" width="176" height="60" rx="6"/><text class="dg-t dg-code" x="104" y="221">registry.yaml</text><text class="dg-s" x="104" y="240">14 sources · Pydantic</text>
<rect class="dg-key" x="213" y="196" width="176" height="60" rx="6"/><text class="dg-t dg-on-key" x="301" y="221">Factory DAG</text><text class="dg-s dg-on-key" x="301" y="240">one DAG per source</text>
<rect class="dg-model" x="422" y="186" width="164" height="60" rx="6"/>
<rect class="dg-model" x="416" y="191" width="170" height="60" rx="6"/>
<rect class="dg-model" x="410" y="196" width="176" height="60" rx="6"/><text class="dg-t dg-code" x="498" y="221">call_summaries</text><text class="dg-s" x="498" y="240">rx_claims, grievances, …</text>
<rect class="dg-model" x="607" y="196" width="177" height="60" rx="6"/><text class="dg-t" x="695" y="221">Load job (PySpark)</text><text class="dg-s" x="695" y="240">extract → transform → load</text>
<path class="dg-line" d="M192 226 H213" marker-end="url(#c360-fw-head)"/>
<path class="dg-line" d="M389 226 H410" marker-end="url(#c360-fw-head)"/>
<path class="dg-line" d="M586 226 H607" marker-end="url(#c360-fw-head)"/>
<path class="dg-line" d="M695 256 V284" marker-end="url(#c360-fw-head)"/>
<rect class="dg-data" x="607" y="284" width="177" height="52" rx="6"/><text class="dg-t" x="695" y="306">Bigtable</text><text class="dg-s dg-code" x="695" y="324" style="font-size:11px">member_context_table</text>
<text class="dg-l" x="16" y="306">A new source = a registry entry and two YAML files.</text>
<text class="dg-l" x="16" y="324">No new pipeline code.</text>
</svg>
