<title id="ci2-pipe-title">Daily batch flow for the summary model</title>
<desc id="ci2-pipe-desc">Five steps: pick the calls from a few days earlier, pre-process each transcript, build the prompt with the response schema, call the LLM at low temperature with backoff retries, then store the encrypted JSON summary with its token counts.</desc>
