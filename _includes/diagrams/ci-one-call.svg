<text class="dg-mono" x="28" y="62" xml:space="preserve"><tspan x="28" dy="0">AGENT: Thanks for calling. How</tspan><tspan x="28" dy="18">       can I help today?</tspan><tspan x="28" dy="18">CALLER: My claim for a stress</tspan><tspan x="28" dy="18">        test was denied and I</tspan><tspan x="28" dy="18">        don't know why.</tspan><tspan x="28" dy="18">AGENT: Let me look... I see it</tspan><tspan x="28" dy="18">       needed a prior</tspan><tspan x="28" dy="18">       authorization.</tspan><tspan x="28" dy="18">CALLER: My cardiologist said</tspan><tspan x="28" dy="18">        he sent it.</tspan><tspan x="28" dy="18">AGENT: I'll send a reprocessing</tspan><tspan x="28" dy="18">       request today.</tspan><tspan class="dg-faint" x="28" dy="24">… greetings, ID checks, hold …</tspan></text>
