<title id="ci4-vc-title">One sentence, four entity types</title>
<desc id="ci4-vc-desc">The mock summary sentence "an office visit. Her cardiologist said she had a stroke" produces four entities. Benefit: office visit maps to Place of service. Specialist: cardiologist maps to Cardiologist. Procedure: office visit maps to Physician visit. Disease: stroke maps to Cerebrovascular disease.</desc>
