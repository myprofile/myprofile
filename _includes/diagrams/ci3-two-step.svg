<svg class="sketch" viewBox="0 0 800 224" role="img" aria-labelledby="ci3-two-title ci3-two-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ci3-two-title">Two-step labeling: group first, then topic</title>
<desc id="ci3-two-desc">Each component, either one intent or the concise summary, goes to a first LLM call that predicts topic groups from a fixed list. A hand-curated map turns those groups into a short list of candidate topics. A second LLM call, given few-shot examples picked by n-gram overlap, chooses the topic or topics from that short list, or None.</desc>
