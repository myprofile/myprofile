<svg class="sketch" viewBox="0 0 830 415" role="img" aria-labelledby="fair-decision-title fair-decision-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fair-decision-title">Choosing fairness metrics for summarization</title>
<desc id="fair-decision-desc">For a summarization task, LangFair asks whether fairness through unawareness is satisfied. If yes, use toxicity metrics. If no, ask whether counterfactual checks are needed: if not, toxicity and stereotype; if so, toxicity, stereotype and counterfactual.</desc>
